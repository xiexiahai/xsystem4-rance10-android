name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -e
          PREINSTALLED="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$PREINSTALLED" -name sdkmanager -type f | head -1)"
          echo "sdkmanager: $SDKMANAGER"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH" >> "$GITHUB_ENV"

      - name: Install build tools
        run: |
          missing=""
          for tool in ninja flex bison; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "installing:$missing"
            sudo apt-get update -o Acquire::Retries=5 -qq || true
            sudo apt-get install -y --no-install-recommends $missing
          fi
          flex --version
          bison --version | head -1
          ninja --version

      - name: Build native engine (arm64-v8a)
        run: |
          cmake -S engine -B build-android-arm64 -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=21 \
            -DANDROID_USE_LEGACY_TOOLCHAIN_FILE=OFF \
            -DCMAKE_STAGING_PREFIX="$PWD/android/deps/stage" \
            -DCMAKE_FIND_ROOT_PATH="$PWD/android/deps/stage" \
            -DCMAKE_MODULE_PATH="$PWD/android/cmake" \
            -DCMAKE_PROJECT_INCLUDE="$PWD/tools/android-imports.cmake" \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384" \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON \
            -DXSYSTEM4_RANCE10_CHEATS=OFF \
            -DXSYSTEM4_RANCE03_MOD=OFF
          cmake --build build-android-arm64 --parallel 4

      - name: Stage JNI libraries
        run: |
          mkdir -p android/project/app/src/main/jniLibs/arm64-v8a
          cp build-android-arm64/libxsystem4.so android/project/app/src/main/jniLibs/arm64-v8a/
          cp android/deps/stage/lib/libSDL2.so android/deps/stage/lib/libcglm.so android/project/app/src/main/jniLibs/arm64-v8a/

      - name: Build development APK (no bundled game data)
        working-directory: android/project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rance10-dev-arm64
          path: android/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: libxsystem4-arm64
          path: build-android-arm64/libxsystem4.so
          if-no-files-found: error
